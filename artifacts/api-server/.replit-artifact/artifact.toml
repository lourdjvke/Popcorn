kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "../../.pythonlibs/bin/python start_api.py"

[services.production]

[services.production.build]
args = ["uv", "sync", "--locked", "--no-dev"]

[services.production.build.env]
UV_PROJECT_ENVIRONMENT = ".pythonlibs"
NODE_ENV = "production"

[services.production.run]
args = [".pythonlibs/bin/python", "artifacts/api-server/start_api.py"]

[services.production.run.env]
PORT = "8080"
UV_PROJECT_ENVIRONMENT = ".pythonlibs"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
