[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Levity Build", email = "levity.build@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
    "requests>=2.32,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
repl-nix-workspace = "repl_nix_workspace:main"

[tool.vercel]
entrypoint = "api:app"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
